<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muhammad Aby</title>
    <!-- Tambahan CDN Tailwind CSS agar kelas flex/text-sm berfungsi dengan baik -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="login.css">
</head>
<body class="relative min-h-screen flex flex-col items-center justify-center m-0">

    <!-- 1. IKON PESAN DIRECT DI UJUNG KANAN ATAS -->
    <div class="absolute top-6 right-6 z-50">
        <a href="kontak.html" class="flex items-center justify-center w-12 h-12 bg-slate-800/80 hover:bg-slate-700 text-white rounded-full shadow-lg backdrop-blur-md transition-all border border-slate-700" title="Pesan Direct">
            <i class="fa-solid fa-paper-plane text-sm"></i>
        </a>
    </div>

    <!-- 2. KOTAK LOGIN / UTAMA -->
    <div class="login-box">
        <h2>Selamat Datang</h2>
        <form action="triger.html" method="GET" class="form">
            <a href="triger.html" class="btn-login">Lanjutkan</a>
        </form>
    </div>

    <!-- 3. FOOTER -->
    <footer class="footer">
        <p>&copy; 2026 M.Abiyantoro. All rights reserved.</p>
    </footer>

    <!-- Elemen Audio -->
    <audio id="bgMusic" loop>
        <source src="Bruno mars - Die with a smile.mp3" type="audio/mpeg">
        Browser Anda tidak mendukung elemen audio.
    </audio>

    <!-- Tombol Floating Play/Pause Musik -->
    <button id="musicToggleBtn" class="music-btn" onclick="toggleMusic()">
        🎵 <span id="musicText">Play Music</span>
    </button>

    <!-- Script Musik -->
    <script>
        const bgMusic = document.getElementById("bgMusic");
        const musicText = document.getElementById("musicText");
        let isMusicPlaying = false;

        // Atur volume musik (0.0 sampai 1.0)
        bgMusic.volume = 0.3; 

        function toggleMusic() {
            if (isMusicPlaying) {
                // Jika sedang play, maka pause
                bgMusic.pause();
                musicText.innerText = "Play Music";
                isMusicPlaying = false;
            } else {
                // Jika sedang pause, maka play
                bgMusic.play().then(() => {
                    musicText.innerText = "Pause Music";
                    isMusicPlaying = true;
                }).catch((error) => {
                    console.log("Pemutaran audio diblokir oleh browser:", error);
                });
            }
        }
    </script>
</body>
</html>
